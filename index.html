<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts</title>
<meta name="theme-color" content="#f5c400">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light dark;--bg:#eceff2;--card:#fff;--ink:#14202b;--mut:#5d6b78;--line:#d3dae1;--acc:#f5c400;--onacc:#14202b;--debe:#b42318;--debebg:#fee4e2;--ok:#05603a;--okbg:#d1fadf;--inp:#f7f9fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18232f;--ink:#eef2f6;--mut:#9aa8b5;--line:#2b3947;--debe:#fda29b;--debebg:#4a1d18;--ok:#75e0a7;--okbg:#0f3a28;--inp:#0f1720}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18232f;--ink:#eef2f6;--mut:#9aa8b5;--line:#2b3947;--debe:#fda29b;--debebg:#4a1d18;--ok:#75e0a7;--okbg:#0f3a28;--inp:#0f1720}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:11px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-weight:600}
nav button[aria-pressed="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.lang{display:flex;justify-content:flex-end;gap:4px}
.lang button{padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-size:14px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;padding:13px;font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:8px}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.srow{display:flex;gap:8px;align-items:stretch}
.srow #q{flex:1;min-width:0}
.srow .btn{width:96px;margin-top:0;font-size:20px}
#q{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;padding:16px}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.slab{margin-top:14px;border-radius:10px;padding:16px;background:var(--okbg);color:var(--ok)}
.slab.debe{background:var(--debebg);color:var(--debe)}
.slab h2{margin:0;font-size:28px;line-height:1.1}
.slab p{margin:4px 0 0}
.row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
.row b{font-size:18px;font-variant-numeric:tabular-nums}
.lotline{margin-bottom:8px;font-size:15px}
.lot{display:inline-block;margin-left:4px;padding:2px 10px;border-radius:6px;background:var(--acc);color:var(--onacc);font-size:22px;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.meta{color:var(--mut);font-size:14px;margin-top:2px}
.tag{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:99px;font-size:13px;font-weight:700;background:var(--okbg);color:var(--ok)}
.tag.p{background:var(--debebg);color:var(--debe)}
.act{display:flex;gap:8px;margin-top:10px}
.act input{width:90px;padding:10px}
.act button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.act button.go{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:10px;padding:0 12px 12px}
summary{padding:12px 0;cursor:pointer;font-weight:700;list-style-position:inside}
details .row{background:var(--bg)}
.act.eds{justify-content:flex-end;margin-top:0}
.act button.ghost{flex:0 0 auto;padding:6px 14px;background:transparent;color:var(--mut);border:1px solid var(--line);font-size:14px}
details.cov{border-left:4px solid var(--ok)}
details.cov summary{color:var(--ok)}
.ok{color:var(--ok);font-weight:700}
.hint{color:var(--mut);margin-top:14px}
.msg{margin-top:10px;font-weight:600;color:var(--ok)}
textarea{min-height:140px;font:13px/1.3 ui-monospace,Menlo,monospace}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1 data-t="title">Shorts</h1>
<nav>
<button data-v="inicio" aria-pressed="true" data-t="home">Home</button>
<button data-v="agregar" aria-pressed="false" data-t="add">Add</button>
<button data-v="lista" aria-pressed="false" data-t="list">List</button>
</nav>

<section id="inicio">
<div class="lang" role="group" aria-label="Language">
<button data-l="en" aria-pressed="true">EN</button>
<button data-l="es" aria-pressed="false">ES</button>
</div>
<label for="q" data-t="search">Search short</label>
<div class="srow"><input id="q" autocomplete="off" autocapitalize="characters" enterkeyhint="search" data-p="partph" placeholder="Part number"><button class="btn" id="go">OK</button></div>
<div id="res"></div>
</section>

<section id="agregar" hidden>
<label for="mo" data-t="model">Model</label>
<input id="mo" autocomplete="off">
<label for="lo" data-t="lot">Lot</label>
<input id="lo" autocomplete="off" autocapitalize="characters">
<label for="fe" data-t="kdate">Kitting date</label>
<input id="fe" type="date">
<div id="blks"></div>
<button class="btn sec" id="more" data-t="more">+ Add another</button>
<button class="btn" id="add" data-t="save">Save</button>
<div class="msg" id="addmsg" role="status"></div>
</section>

<section id="lista" hidden>
<div id="all"></div>
<button class="btn sec" id="bk" data-t="showbk">Show backup</button>
<div id="bkbox" hidden>
<label for="bkt" data-t="bklabel">Copy this text to save your shorts. Paste it here to restore them.</label>
<textarea id="bkt"></textarea>
<button class="btn" id="rs" data-t="restore">Restore from this text</button>
</div>
<div class="msg" id="bkmsg" role="status"></div>
</section>
</main>

<script>
(function(){
var TX={
en:{title:"Shorts",home:"Home",add:"Add",list:"List",search:"Search short",partph:"Part number",
hint:"Type the part number and I will tell you if you owe it.",noowe:"You don’t owe it",norec:"This part has no shorts on record.",
owe:"You owe {n} pcs",covered:"Covered",covmsg:"You don’t owe it. Everything was delivered.",lot:"Lot",none:"none",model:"Model",
kitted:"kitted",nodate:"no date",pending:"Pending {a} of {b}",deliveries:"Deliveries:",pcson:"{c} pcs on {d}",qtyd:"Quantity delivered",
deliver:"Deliver",edit:"Edit",cancel:"Cancel",qtytot:"Total quantity",del:"Delete",nolot:"No lot",pendof:"{a} pending of {b}",allcov:"all covered",
empty:"You have no saved shorts. Add the first one in the Add tab.",kdate:"Kitting date",partno:"Part no.",material:"Material",
pendq:"Pending quantity",remove:"Remove",more:"+ Add another",save:"Save",lotmiss:"The lot is missing.",
check:"Check part {n}: the part number or quantity is missing.",addone:"Add at least one part.",saved1:"1 short saved.",savedn:"{n} shorts saved.",
showbk:"Show backup",bklabel:"Copy this text to save your shorts. Paste it here to restore them.",restore:"Restore from this text",
restored:"Shorts restored.",invalid:"That text is not a valid backup."},
es:{title:"Cortos",home:"Inicio",add:"Agregar",list:"Lista",search:"Buscar corto",partph:"Número de parte",
hint:"Escribe el número de parte y te digo si lo debes.",noowe:"No lo debes",norec:"Esta parte no tiene cortos registrados.",
owe:"Debes {n} pzas",covered:"Cubierto",covmsg:"No lo debes. Ya entregaste todo.",lot:"Lote",none:"ninguno",model:"Modelo",
kitted:"elaborado",nodate:"sin fecha",pending:"Pendiente {a} de {b}",deliveries:"Entregas:",pcson:"{c} pzas el {d}",qtyd:"Cantidad entregada",
deliver:"Entregar",edit:"Editar",cancel:"Cancelar",qtytot:"Cantidad total",del:"Borrar",nolot:"Sin lote",pendof:"{a} pendientes de {b}",allcov:"todo cubierto",
empty:"No tienes cortos guardados. Agrega el primero en la pestaña Agregar.",kdate:"Fecha de elaboración",partno:"No. de parte",material:"Material",
pendq:"Cantidad pendiente",remove:"Quitar",more:"+ agregar otro",save:"Guardar",lotmiss:"Falta el lote.",
check:"Revisa la parte {n}: falta el número de parte o la cantidad.",addone:"Agrega al menos una parte.",saved1:"1 corto guardado.",savedn:"{n} cortos guardados.",
showbk:"Mostrar respaldo",bklabel:"Copia este texto para guardar tus cortos. Pégalo aquí para restaurarlos.",restore:"Restaurar desde este texto",
restored:"Cortos restaurados.",invalid:"Ese texto no es un respaldo válido."}};
var lang="en";try{lang=localStorage.getItem("cortos:lang")||"en"}catch(x){}
if(!TX[lang])lang="en";
function t(k,v){var s=TX[lang][k]!=null?TX[lang][k]:TX.en[k];if(v)for(var n in v)s=s.replace("{"+n+"}",v[n]);return s}
function tr(root){root.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});root.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=t(e.dataset.p)})}

var K2="cortos:v2",K1="cortos:v1",items=[],openSet={};
function load(){try{var r=localStorage.getItem(K2);
 if(r){items=JSON.parse(r)}else{var o=localStorage.getItem(K1);
 items=o?JSON.parse(o).map(function(i){return{id:i.id,modelo:"",lote:i.l||"",fecha:"",p:i.p,m:i.m||"",q:i.q,e:[]}}):[]}
 if(!Array.isArray(items))items=[]}catch(x){items=[]}}
function save(){try{localStorage.setItem(K2,JSON.stringify(items))}catch(x){}}
function norm(s){return String(s||"").toUpperCase().replace(/[\s\-_.\/]/g,"")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(id){return document.getElementById(id)}
function today(){var d=new Date(),z=function(n){return(n<10?"0":"")+n};return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function fmt(f){if(!f)return t("nodate");var a=f.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function pend(i){return i.q-(i.e||[]).reduce(function(a,x){return a+x.c},0)}
function hist(i){return(i.e&&i.e.length)?'<div class="meta">'+t("deliveries")+" "+i.e.map(function(x){return t("pcson",{c:x.c,d:fmt(x.f)})}).join("; ")+'</div>':""}

function rowHTML(i,mode){
 var pe=pend(i),h='<div class="row">';
 if(mode==="inicio")h+='<div class="lotline">'+t("lot")+'<span class="lot">'+esc(i.lote||t("none"))+'</span></div>';
 h+='<b>'+esc(i.p)+'</b> '+esc(i.m||"");
 if(mode==="inicio")h+='<div class="meta">'+t("model")+" "+esc(i.modelo||t("none"))+", "+t("kitted")+" "+fmt(i.fecha)+'</div>';
 h+='<div>'+(pe>0?'<span class="tag p">'+t("pending",{a:pe,b:i.q})+'</span>':'<span class="tag">'+t("covered")+'</span>')+'</div>'+hist(i);
 if(mode==="inicio"&&pe>0)h+='<div class="act"><input type="number" inputmode="numeric" min="1" max="'+pe+'" value="'+pe+'" aria-label="'+t("qtyd")+'" id="r'+i.id+'"><button class="go" data-s="'+i.id+'">'+t("deliver")+'</button></div>';
 if(mode==="lista")h+='<div class="act"><button data-d="'+i.id+'">'+t("del")+'</button></div>';
 return h+'</div>';
}

var searched=false,editKey=null;
function inicio(){
 var n=norm($("q").value),out=$("res");
 if(!searched||!n){out.innerHTML="";return}
 var m=items.filter(function(i){return norm(i.p)===n});
 if(!m.length){out.innerHTML='<div class="slab"><h2>'+t("noowe")+'</h2><p>'+t("norec")+'</p></div>';return}
 m.sort(function(a,b){return(a.fecha||"9")<(b.fecha||"9")?-1:1});
 var tot=m.reduce(function(a,i){return a+Math.max(pend(i),0)},0);
 out.innerHTML=(tot>0?'<div class="slab debe"><h2>'+t("owe",{n:tot})+'</h2><p>'+esc(m[0].m||m[0].p)+'</p></div>':'<div class="slab"><h2>'+t("covered")+'</h2><p>'+t("covmsg")+'</p></div>')+m.map(function(i){return rowHTML(i,"inicio")}).join("");
}

function edHTML(k,a){
 var h='<div class="row ed"><label>'+t("lot")+'</label><input class="el" autocapitalize="characters" value="'+esc(k)+'"><label>'+t("model")+'</label><input class="em" value="'+esc(a[0].modelo||"")+'"><label>'+t("kdate")+'</label><input class="ef" type="date" value="'+esc(a[0].fecha||"")+'">';
 a.forEach(function(i){h+='<div class="row edp" data-id="'+i.id+'"><label>'+t("partno")+'</label><input class="ep" autocapitalize="characters" value="'+esc(i.p)+'"><label>'+t("material")+'</label><input class="eM" value="'+esc(i.m||"")+'"><label>'+t("qtytot")+'</label><input class="eq" type="number" inputmode="numeric" min="1" value="'+i.q+'"></div>'});
 return h+'<div class="msg ermsg" role="alert" style="color:var(--debe)"></div><div class="act"><button data-ec="1">'+t("cancel")+'</button><button class="go" data-es="1">'+t("save")+'</button></div></div>';
}
function lista(){
 var g={};items.forEach(function(i){var k=i.lote||"";(g[k]=g[k]||[]).push(i)});
 var keys=Object.keys(g);
 function fd(k){return g[k].map(function(i){return i.fecha||""}).sort().pop()}
 function nid(k){return Math.max.apply(null,g[k].map(function(i){return i.id||0}))}
 keys.sort(function(a,b){var x=fd(a),y=fd(b);return x>y?-1:x<y?1:nid(b)-nid(a)});
 $("all").innerHTML=keys.length?keys.map(function(k){
  var a=g[k],np=a.filter(function(i){return pend(i)>0}).length,ed=(editKey===k);
  var mo=a[0].modelo?t("model")+" "+esc(a[0].modelo)+", ":"";
  var body=ed?edHTML(k,a):'<div class="act eds"><button class="ghost" data-ed="'+esc(k)+'">'+t("edit")+'</button></div>'+a.map(function(i){return rowHTML(i,"lista")}).join("");
  return'<details data-k="'+esc(k)+'"'+(np?"":' class="cov"')+((openSet[k]||ed)?" open":"")+'><summary>'+(k?t("lot")+" "+esc(k):t("nolot"))+'<div class="meta">'+mo+fmt(a[0].fecha)+", "+(np?t("pendof",{a:np,b:a.length}):'<span class="ok">'+t("allcov")+'</span>')+'</div></summary>'+body+'</details>';
 }).join(""):'<p class="hint">'+t("empty")+'</p>';
}

function blk(rm){return'<div class="row blk"><label data-t="partno"></label><input class="bp" autocomplete="off" autocapitalize="characters"><label data-t="material"></label><input class="bm" autocomplete="off"><label data-t="pendq"></label><input class="bc" type="number" inputmode="numeric" min="1">'+(rm?'<div class="act"><button data-x="1" data-t="remove"></button></div>':"")+'</div>'}
function resetForm(){$("blks").innerHTML=blk(false);tr($("blks"))}

function applyLang(){
 document.documentElement.lang=lang;document.title=t("title");tr(document);
 document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});
 $("addmsg").textContent="";$("bkmsg").textContent="";inicio();lista();
}
function view(v){
 ["inicio","agregar","lista"].forEach(function(s){$(s).hidden=(s!==v)});
 document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===v)});
 if(v==="lista")lista(); if(v==="inicio"){inicio();$("q").focus()}
}

document.querySelector("nav").addEventListener("click",function(e){var v=e.target.dataset&&e.target.dataset.v;if(v)view(v)});
$("q").addEventListener("input",function(){searched=false;inicio()});
$("go").addEventListener("click",function(){searched=true;inicio();$("q").blur()});
$("q").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("go").click()}});
$("more").addEventListener("click",function(){$("blks").insertAdjacentHTML("beforeend",blk(true));tr($("blks"));var b=$("blks").querySelectorAll(".bp");b[b.length-1].focus()});

$("add").addEventListener("click",function(){
 var msg=$("addmsg"),lote=$("lo").value.trim().toUpperCase(),nuevos=[];
 msg.style.color="var(--debe)";
 if(!lote){msg.textContent=t("lotmiss");return}
 var bs=$("blks").querySelectorAll(".blk");
 for(var k=0;k<bs.length;k++){
  var p=bs[k].querySelector(".bp").value.trim(),m=bs[k].querySelector(".bm").value.trim(),q=parseInt(bs[k].querySelector(".bc").value,10);
  if(!p&&!m&&!q)continue;
  if(!p||!q||q<1){msg.textContent=t("check",{n:k+1});return}
  nuevos.push({id:Date.now()+k+Math.floor(Math.random()*1000),modelo:$("mo").value.trim(),lote:lote,fecha:$("fe").value,p:p.toUpperCase(),m:m,q:q,e:[]});
 }
 if(!nuevos.length){msg.textContent=t("addone");return}
 items=items.concat(nuevos);save();
 $("mo").value="";$("lo").value="";$("fe").value=today();resetForm();
 msg.style.color="var(--ok)";msg.textContent=nuevos.length>1?t("savedn",{n:nuevos.length}):t("saved1");
});

document.addEventListener("click",function(e){
 var t0=e.target,ds=t0.dataset||{};
 if("ed" in ds){editKey=ds.ed;openSet[ds.ed]=true;lista();return}
 if(ds.ec){editKey=null;lista();return}
 if(ds.es){
  var f=t0.closest(".ed"),ms=f.querySelector(".ermsg"),lote=f.querySelector(".el").value.trim().toUpperCase(),ups=[],bad=0;
  if(!lote){ms.textContent=t("lotmiss");return}
  f.querySelectorAll(".edp").forEach(function(r,n){
   var it=items.filter(function(i){return String(i.id)===r.dataset.id})[0],p=r.querySelector(".ep").value.trim().toUpperCase(),q=parseInt(r.querySelector(".eq").value,10);
   if(!it||!p||!q||q<1){if(!bad)bad=n+1;return}
   ups.push([it,p,r.querySelector(".eM").value.trim(),q]);
  });
  if(bad){ms.textContent=t("check",{n:bad});return}
  var mod=f.querySelector(".em").value.trim(),fe=f.querySelector(".ef").value;
  ups.forEach(function(u){var it=u[0],dl=(it.e||[]).reduce(function(a,x){return a+x.c},0);it.p=u[1];it.m=u[2];it.q=Math.max(u[3],dl);it.lote=lote;it.modelo=mod;it.fecha=fe});
  openSet[lote]=true;editKey=null;save();lista();return;
 }
 if(ds.l){lang=ds.l;try{localStorage.setItem("cortos:lang",lang)}catch(x){}applyLang();return}
 if(ds.s){
  var it=items.filter(function(i){return String(i.id)===ds.s})[0];if(!it)return;
  var r=parseInt($("r"+ds.s).value,10);if(!r||r<1)return;
  r=Math.min(r,pend(it));it.e=(it.e||[]).concat([{f:today(),c:r}]);save();inicio();
 }
 if(ds.d){items=items.filter(function(i){return String(i.id)!==ds.d});save();lista()}
 if(ds.x){t0.closest(".blk").remove()}
});
document.addEventListener("toggle",function(e){if(e.target.dataset&&"k" in e.target.dataset)openSet[e.target.dataset.k]=e.target.open},true);

$("bk").addEventListener("click",function(){$("bkt").value=JSON.stringify(items);$("bkbox").hidden=false;$("bkt").select()});
$("rs").addEventListener("click",function(){
 var msg=$("bkmsg");
 try{var d=JSON.parse($("bkt").value);if(!Array.isArray(d))throw 0;items=d;save();lista();msg.style.color="var(--ok)";msg.textContent=t("restored")}
 catch(x){msg.style.color="var(--debe)";msg.textContent=t("invalid")}
});

load();$("fe").value=today();resetForm();applyLang();view("inicio");
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(x){}}
})();
</script>
</body>
</html>
